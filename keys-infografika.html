<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Инфографика для карточек: примеры работ · Евгения Гаршина</title>
<meta name="description" content="Примеры инфографики для карточек WB и Ozon: обложки и слайды. Цену называю до начала работы.">
<style>
:root{--w:#fff;--g:#f1f1f1;--ink:#111;--soft:#555;--lime:#d4ff3f;--line:rgba(17,17,17,.14);--pad:clamp(20px,5vw,90px);--hand:'Bad Script','Segoe Script',cursive;--sans:'Inter','Segoe UI',Arial,sans-serif;--sh:0 22px 44px -26px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--w);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:auto}
.hand{font-family:var(--hand);font-weight:400}
.hl{display:inline-block;line-height:1;padding:0 .14em .06em;margin:0 -.14em;background:linear-gradient(transparent 56%,var(--lime) 56% 90%,transparent 90%)}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;padding:12px var(--pad);border-bottom:1px solid var(--line)}
.brand{font-family:var(--hand);font-size:30px;line-height:1}
nav{display:flex;gap:28px;font-size:15px;font-weight:500;color:var(--soft)}
nav a:hover{color:var(--ink)}
.soc{display:flex;gap:8px;margin-left:auto}
.soc a{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);font-size:12px;font-weight:700;letter-spacing:.02em;transition:background .2s,transform .2s}
.soc a:hover{background:var(--lime);transform:translateY(-2px)}
.btn{display:inline-block;padding:16px 30px;border-radius:999px;background:var(--ink);color:#fff;font-weight:500;font-size:16px;white-space:nowrap;cursor:pointer;border:0;font-family:var(--sans);transition:transform .2s}
.btn.o{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.l{background:var(--lime);color:var(--ink);font-weight:600}
.btn:hover{transform:translateY(-2px)}
/* первый экран */
.hero{padding:54px var(--pad) 40px;display:grid;grid-template-columns:1.25fr .75fr;gap:56px;align-items:center}
.myname{font-family:var(--hand);font-size:clamp(28px,3.2vw,44px);line-height:1.1;margin-bottom:14px}
.kick{font-size:14px;letter-spacing:.34em;color:#666;font-weight:400;margin-bottom:14px}
h1{font-family:var(--hand);font-weight:400;font-size:clamp(44px,5.6vw,92px);line-height:1.08;margin:0 0 24px;text-wrap:balance}
.lead{font-size:clamp(17px,1.5vw,21px);color:#444;max-width:620px}
.cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:32px}
.facts{margin-top:24px}.facts div{display:flex;align-items:baseline;gap:10px}.facts b{font-size:32px;font-weight:600;background:linear-gradient(transparent 58%,var(--lime) 58%);padding:0 6px}.facts span{font-size:15px;color:var(--soft)}
.meb{display:flex;flex-direction:column;align-items:center;gap:16px}
.mew{position:relative;width:100%;max-width:440px}
.circ{position:absolute;left:-46px;top:34px;width:78%;aspect-ratio:1;border-radius:50%;background:var(--lime)}
.me{position:relative;border-radius:999px 999px 36px 36px;overflow:hidden;aspect-ratio:4/5.2;box-shadow:var(--sh)}
.me img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.mecap{font-family:var(--hand);font-size:19px;color:var(--soft);text-align:center;max-width:340px;line-height:1.4}
section{padding:56px var(--pad)}
h2{font-family:var(--hand);font-weight:400;font-size:clamp(34px,4.4vw,64px);line-height:1.1;margin-bottom:16px;max-width:900px;text-wrap:balance}
.grp{font-family:var(--hand);font-weight:400;font-size:clamp(28px,3vw,40px);margin:34px 0 22px}
/* чем занимаюсь */
#about{padding-top:30px}
.what{background:var(--g);border-radius:30px;padding:10px 32px;max-width:980px}
.wr{display:grid;grid-template-columns:150px 1fr auto;gap:22px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.wr:last-child{border-bottom:0}
.wt{font-size:12px;letter-spacing:.16em;font-weight:600}
.wt:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--lime);border:1.5px solid var(--ink);margin-right:10px;vertical-align:-1px}
.wd b{display:block;font-size:19px;font-weight:600;line-height:1.3;margin-bottom:3px}
.wd span{font-size:15px;color:var(--soft)}
.wp{font-size:14px;font-weight:600;white-space:nowrap}
/* работы */
.works{display:grid;grid-template-columns:repeat(2,1fr);gap:26px;align-items:start}
.works .col{display:flex;flex-direction:column;gap:26px}
.work img{border-radius:26px;box-shadow:var(--sh)}
.tag{display:inline-block;margin:16px 4px 0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;background:var(--lime);padding:3px 10px;border-radius:999px}
.work h3{font-size:20px;font-weight:600;margin:10px 4px 2px;line-height:1.25;text-wrap:balance}
.work a.l{display:inline-flex;align-items:center;min-height:44px;margin:0 4px;font-weight:600;text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:5px}
.works:not(.three){max-width:1400px}
.works.three{grid-template-columns:repeat(3,1fr);max-width:1400px}.works.three,.works.three .col{gap:14px}.works.three .work img{border-radius:14px}.works.three .work h3{font-size:14px;margin:6px 2px 0;font-weight:500}
/* спокойно */
#trust{padding-top:24px;padding-bottom:24px}#trust h2{text-align:center;margin:0 auto 6px;font-size:clamp(30px,3.6vw,46px)}
.gar{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px;text-align:center}
.gar div{border-top:3px solid var(--lime);padding-top:12px;font-size:clamp(16px,1.8vw,21px);font-weight:500}
/* услуги */
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:stretch}
.srv{background:var(--ink);color:#fff;border-radius:30px;padding:34px 28px;display:flex;flex-direction:column}
.srv.light{background:var(--g);color:var(--ink)}
.srv h3{font-size:22px;font-weight:600;margin-bottom:6px}
.srv .p{font-size:40px;font-weight:300;color:var(--lime);margin:6px 0 16px}
.srv.light .p{color:var(--ink);background:linear-gradient(transparent 58%,var(--lime) 58%);align-self:flex-start;padding:0 8px}
.srv ul{list-style:none;display:grid;gap:8px;font-size:16px;margin-bottom:24px}
.srv li:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lime);margin-right:10px}
.srv.light li:before{border:1.5px solid var(--ink);width:10px;height:10px}
.srv .btn{margin-top:auto;text-align:center;background:var(--lime);color:var(--ink);font-weight:600}
.srv-wide{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-top:22px;padding:26px 32px;border-radius:26px;border:2px dashed var(--ink)}
.srv-wide h3{font-size:22px;font-weight:600;margin-bottom:4px}.srv-wide p{color:var(--soft)}
/* шаги */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.step{border-top:2px solid var(--ink);padding-top:16px}
.step em{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--lime);font-style:normal;font-weight:600;font-size:20px}
.step h3{font-size:19px;font-weight:600;margin:10px 0 4px}
.step p{color:var(--soft);font-size:15px}
/* контакт */
.contact{background:var(--lime);text-align:center;padding:84px var(--pad)}
.contact h2{margin:0 auto 22px}
.contact .btn{background:var(--ink);color:#fff}
.contact .alt{margin-top:22px;font-size:17px;font-weight:500}
.contact .alt a{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;display:inline-block;padding:10px 4px}
footer{padding:26px var(--pad);font-size:13px;color:var(--soft);display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap}
.fab{position:fixed;right:18px;bottom:18px;z-index:20;background:var(--ink);color:#fff;border-radius:999px;padding:14px 22px;font-weight:500;font-size:15px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}
a:focus-visible,.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
.btn:focus-visible,.fab:focus-visible{border-radius:999px}
.srv a:focus-visible,.fab:focus-visible{outline-color:var(--lime)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:0 64px;background:#fff;border:2px solid var(--ink);border-radius:30px;padding:36px 40px;max-width:1100px;margin-top:22px}
.mt{font-family:var(--hand);font-weight:400;font-size:clamp(28px,3vw,38px);line-height:1.1;margin:0 0 18px}
.mi{margin-bottom:20px}
.mr{display:flex;align-items:baseline;gap:10px;font-size:18px;font-weight:500}
.mr b{font-weight:500}
.mr i{flex:1;min-width:18px;border-bottom:2px dotted rgba(17,17,17,.4);transform:translateY(-5px)}
.mr span{white-space:nowrap;font-weight:600;background:linear-gradient(transparent 58%,var(--lime) 58%);padding:0 6px}
.md{font-size:14.5px;color:var(--soft);margin-top:5px;line-height:1.45;max-width:440px}
p,.md,.lead,.mecap{text-wrap:pretty}
.mf{grid-column:1/-1;margin-top:8px}
@media (max-width:900px){.menu{grid-template-columns:1fr;padding:24px 18px}.mr{font-size:16px;gap:8px}.mt{margin-bottom:12px}.mi{margin-bottom:16px}.md{font-size:13.5px}.mg+.mg{margin-top:12px}}
@media (max-width:900px){
  nav{display:none}
  .soc a{width:38px;height:38px}
  .hero{grid-template-columns:1fr;gap:18px;padding-top:18px;padding-bottom:20px}
  .meb{order:-1;flex-direction:row;align-items:center;gap:16px}
  .mew{max-width:128px;flex:none}.circ{left:-14px;top:12px}
  .me{aspect-ratio:1/1.25}
  .mecap{text-align:left;font-size:16px;max-width:none}
  .services,.steps{grid-template-columns:1fr}
  section{padding:30px var(--pad)}
  .wr{grid-template-columns:1fr;gap:4px;padding:12px 0}.what{padding:6px 20px}.wp{white-space:normal}
  .works.three{grid-template-columns:1fr 1fr;gap:12px}.works.three .col{display:contents}.works.three .work{min-width:0}
  .srv-wide{flex-direction:column;align-items:flex-start}
}
@media (max-width:700px){
  h1{font-size:36px;margin-bottom:12px}
  h2{font-size:30px}
  .kick{font-size:12px;letter-spacing:.18em}
  .cta{margin-top:18px}.cta .btn{padding:14px 22px;font-size:15px}
  .facts{margin-top:10px}.facts b{font-size:24px}.facts span{font-size:13px}
  .grp{margin:20px 0 12px!important}
  #works>div.works:not(.three){display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 calc(var(--pad)*-1);padding:0 var(--pad) 6px;scroll-padding:0 var(--pad);scrollbar-width:none;max-width:none}
  #works>div.works:not(.three)::-webkit-scrollbar{display:none}
  #works>div.works:not(.three) .col{display:contents}
  #works>div.works:not(.three) .work{flex:0 0 78%;scroll-snap-align:start}
  .gar{gap:8px}.gar div{font-size:14px;padding-top:8px}
  .fab{padding:12px 18px;font-size:13px;min-height:44px;display:flex;align-items:center;right:10px;bottom:10px;opacity:.95}
  /* первый экран: слева заголовок и описание, справа фото с подписью */
  .hero{grid-template-columns:1fr 124px;column-gap:14px;row-gap:0;align-items:start}
  .hero>div:first-child{display:contents}
  .myname{grid-column:1;grid-row:1;font-size:28px;margin-bottom:8px}
  .kick{grid-column:1;grid-row:2;margin-bottom:8px}
  .hero h1{grid-column:1;grid-row:3;font-size:30px;margin-bottom:10px}
  .hero .lead{grid-column:1;grid-row:4;font-size:14px;line-height:1.45}
  .meb{order:0;grid-column:2;grid-row:1/5;flex-direction:column;align-items:stretch;gap:10px}
  .mew{max-width:none;width:124px}
  .mecap{font-size:13px;line-height:1.3}
  .hero .cta{grid-column:1/3;grid-row:5}
  .hero .facts{grid-column:1/3;grid-row:6}
}
</style>
<style>
.caseWrap{max-width:1080px;margin:0 auto;padding:28px var(--pad) 70px}
.back{display:inline-flex;align-items:center;min-height:44px;font-weight:600;text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:5px}
.caseWrap h1{font-family:var(--hand);font-weight:400;font-size:clamp(32px,4vw,52px);margin:18px 0 10px}
.caseWrap .lead{max-width:640px;color:var(--soft)}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:32px}
.gal img{width:100%;height:auto;display:block;border-radius:20px;box-shadow:var(--sh)}
.gal h3{font-size:15px;font-weight:500;margin:10px 2px 0}
.cta{margin-top:40px;padding:26px;border-radius:24px;background:rgba(255,250,240,.75);display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
@media(max-width:700px){.gal{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="caseWrap">
<a class="back" href="index.html">← Назад в портфолио</a>
<h1>Карточки для маркетплейсов</h1>
<p class="lead">Обложки и слайды для WB и Ozon. Каждая карточка сделана под товар и под то, что покупатель хочет понять за три секунды.</p>

<figure><img src="infografika-vata.jpg" alt="Пяльцы Сладкая вата: воронка из пяти слайдов" loading="lazy"><h3>Пяльцы: воронка из 5 слайдов</h3></figure>
<figure><img src="kofe.jpg" alt="Кофе: обновление карточки, было и стало" loading="lazy"><h3>Кофе: обновление карточки</h3></figure>
<figure><img src="diffuzor.jpg" alt="Диффузор для офиса: исходное фото и обложка" loading="lazy"><h3>Диффузор для офиса</h3></figure>

</div>
<div class="cta"><p class="lead" style="margin:0">Напишите, какой товар и что важно показать. Назову цену и срок.</p><a class="btn" href="https://t.me/evvalon">Написать в Telegram</a></div>
</main>
</body>
</html>
